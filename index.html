<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaden K · Apps</title>
<meta name="description" content="iPhone apps by Jaden K, including Burst Photo Share.">
<style>
  :root { --ink:#1C1C1E; --mute:#5C5C61; --accent:#E8391A; --bg:#FFFBF8; --card:#fff; --line:rgba(28,28,30,.08); }
  @media (prefers-color-scheme: dark) { :root { --ink:#F2F2F7; --mute:#A1A1A8; --accent:#FF6A3D; --bg:#141216; --card:#1F1C20; --line:rgba(255,255,255,.1); } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:34px; letter-spacing:-.5px; margin:0 0 8px; }
  p.lead { color:var(--mute); margin:0 0 40px; }
  .app { display:flex; gap:16px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; }
  .app h2 { font-size:20px; margin:0 0 4px; }
  .app p { margin:0 0 12px; color:var(--mute); }
  .icon { flex:none; width:64px; height:64px; border-radius:15px; background:linear-gradient(160deg,#FF7A45,#E8391A); }
  a { color:var(--accent); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  footer { margin-top:48px; color:var(--mute); font-size:14px; }
  footer a { font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>Jaden K</h1>
  <p class="lead">Small, focused apps for iPhone.</p>
  <section class="app">
    <div class="icon" aria-hidden="true"></div>
    <div>
      <h2>Burst Photo Share</h2>
      <p>Get the photos you want out of a burst and save or share them as normal photos, with their date, place and camera info intact.</p>
      <a href="https://apps.apple.com/app/id6827839058">View on the App Store</a>
    </div>
  </section>
  <footer>
    <a href="https://sites.google.com/view/appsettings/support">Support</a> ·
    <a href="https://sites.google.com/view/appsettings/prviacy-policy">Privacy policy</a>
  </footer>
</main>
</body>
</html>
